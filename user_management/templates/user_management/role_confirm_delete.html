{% extends 'students/base.html' %}

{% block title %}Delete Role{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-8 col-lg-5 text-center">
        <div class="card border-0 shadow-sm p-5">
            <div class="text-danger mb-4">
                <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
            </div>
            
            <h2 class="h3 fw-bold">Delete Role</h2>
            <p class="text-muted mt-2 mb-4">
                Are you sure you want to delete the role <strong>"{{ object.name }}"</strong>? This action cannot be undone.
            </p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                    <a href="{% url 'role_list' %}" class="btn btn-light border px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
