{% extends 'students/base.html' %}

{% block title %}Deactivate User{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-8 col-lg-5 text-center">
        <div class="card border-0 shadow-sm p-5">
            <div class="text-danger mb-4">
                <i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>
            </div>
            
            <h2 class="h3 fw-bold">Deactivate User</h2>
            <p class="text-muted mt-2 mb-4">
                Are you sure you want to deactivate the user <strong>"{{ object.username }}"</strong>? They will no longer be able to log in.
            </p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger px-4">Yes, Deactivate</button>
                    <a href="{% url 'users_roles' %}" class="btn btn-light border px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
