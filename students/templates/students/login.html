{% extends 'students/auth_base.html' %}

{% block auth_content %}
<div id="step1">
  <div class="form-top">
    <span class="step-tag">STEP 1 OF 2</span>
    <h2>Welcome back</h2>
    <p>Sign in to continue to your dashboard.</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Email address / Username</label>
      <div class="input-shell focused">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"/><path d="m2 6 10 7 10-7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
        <input type="text" name="username" placeholder="you@company.com" required>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-shell">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" placeholder="Enter your password">
        <svg class="toggle-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>

    <div class="row-between">
      <label class="remember"><input type="checkbox" checked> Remember me</label>
      <a class="forgot" href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn-primary">
      Sign in
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="divider">or continue with</div>
  <div style="display:flex;gap:10px;">
    <div class="input-shell" style="justify-content:center;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.86c2.26-2.09 3.57-5.17 3.57-8.87Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.28V6.63H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.37Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.28 6.63l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75Z"/></svg>
      Google
    </div>
    <div class="input-shell" style="justify-content:center;cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45Z"/></svg>
      LinkedIn
    </div>
  </div>

  <div class="switch-link">New to Business Introduction? <a href="{% url 'register_ui' %}">Create an account</a></div>
</div>
{% endblock %}
